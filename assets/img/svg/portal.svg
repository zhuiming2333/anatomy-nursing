<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="肝门静脉与上下腔静脉三大吻合示意图" font-family="system-ui,'Microsoft YaHei',sans-serif">
<defs>
<marker id="v" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2b6f6b"/></marker>
</defs>
<text x="26" y="40" font-size="19" font-weight="700" fill="#2b2b2b">肝门静脉与上、下腔静脉的三大吻合</text>
<text x="26" y="68" font-size="13" fill="#5a5450">门静脉高压 → 侧支循环开放 → 三处静脉曲张</text>
<circle cx="584" cy="44" r="10" fill="#c9574a" stroke="#8d2f26" stroke-width="1.4"/>
<text x="602" y="49" font-size="13" fill="#2b2b2b">曲张的静脉丛</text>
<!-- row 1 -->
<path d="M142 150H196" fill="none" stroke="#2b6f6b" stroke-width="3.4" marker-end="url(#v)"/>
<text x="26" y="155" font-size="13" fill="#2b6f6b">门静脉→胃左静脉</text>
<path d="M215 150H305" fill="none" stroke="#b03a2e" stroke-width="7" stroke-linecap="round"/>
<circle cx="235" cy="150" r="13" fill="#c9574a" stroke="#8d2f26" stroke-width="1.4"/>
<circle cx="265" cy="150" r="15" fill="#c9574a" stroke="#8d2f26" stroke-width="1.4"/>
<circle cx="293" cy="150" r="11" fill="#c9574a" stroke="#8d2f26" stroke-width="1.4"/>
<path d="M330 150H346" fill="none" stroke="#2b6f6b" stroke-width="3.4" marker-end="url(#v)"/>
<text x="352" y="155" font-size="13" fill="#2b6f6b">食管静脉→奇静脉→上腔静脉</text>
<text x="26" y="192" font-size="13" fill="#b03a2e">后果：食管静脉曲张，破裂致呕血</text>
<text x="26" y="212" font-size="13" fill="#7a736c">（食管下段，穿经食管裂孔处）</text>
<!-- row 2 -->
<path d="M142 270H196" fill="none" stroke="#2b6f6b" stroke-width="3.4" marker-end="url(#v)"/>
<text x="26" y="275" font-size="13" fill="#2b6f6b">门静脉→附脐静脉</text>
<circle cx="260" cy="270" r="16" fill="none" stroke="#b03a2e" stroke-width="6"/>
<path d="M228 270H196M292 270H324M260 238V208M260 302V328M236 246L214 224M284 246L306 224M236 294L214 316M284 294L306 316" fill="none" stroke="#b03a2e" stroke-width="3.6" stroke-linecap="round"/>
<circle cx="214" cy="222" r="6" fill="#c9574a"/>
<circle cx="306" cy="222" r="6" fill="#c9574a"/>
<circle cx="214" cy="318" r="6" fill="#c9574a"/>
<circle cx="306" cy="318" r="6" fill="#c9574a"/>
<path d="M330 270H346" fill="none" stroke="#2b6f6b" stroke-width="3.4" marker-end="url(#v)"/>
<text x="352" y="275" font-size="13" fill="#2b6f6b">腹壁上、下静脉→上、下腔静脉</text>
<text x="26" y="312" font-size="13" fill="#b03a2e">后果：脐周静脉曲张，呈“海蛇头”</text>
<text x="26" y="332" font-size="13" fill="#7a736c">（脐周静脉网，经腹壁浅静脉反流）</text>
<!-- row 3 -->
<path d="M142 390H196" fill="none" stroke="#2b6f6b" stroke-width="3.4" marker-end="url(#v)"/>
<text x="26" y="395" font-size="13" fill="#2b6f6b">门静脉→直肠上静脉</text>
<ellipse cx="262" cy="390" rx="42" ry="30" fill="none" stroke="#b03a2e" stroke-width="6"/>
<circle cx="220" cy="390" r="9" fill="#c9574a" stroke="#8d2f26" stroke-width="1.2"/>
<circle cx="304" cy="390" r="9" fill="#c9574a" stroke="#8d2f26" stroke-width="1.2"/>
<circle cx="262" cy="360" r="7" fill="#c9574a"/>
<circle cx="262" cy="420" r="7" fill="#c9574a"/>
<path d="M330 390H346" fill="none" stroke="#2b6f6b" stroke-width="3.4" marker-end="url(#v)"/>
<text x="352" y="395" font-size="13" fill="#2b6f6b">直肠下静脉、肛静脉→髂内静脉→下腔静脉</text>
<text x="26" y="438" font-size="13" fill="#b03a2e">后果：直肠静脉丛曲张形成内痔，便血</text>
<text x="26" y="458" font-size="13" fill="#7a736c">（齿状线上下，分别汇入门静脉系与腔静脉系）</text>
</svg>
