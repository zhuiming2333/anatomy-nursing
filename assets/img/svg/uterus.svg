<text x="452" y="91" font-size="14" font-weight="700" fill="#2b2b2b">阔韧带</text>
<text x="452" y="114" font-size="13" fill="#4a4a4a">子宫两侧的双层腹膜皱襞，</text>
<text x="452" y="134" font-size="13" fill="#4a4a4a">限制子宫向两侧倾斜</text>
<line x1="420" y1="166" x2="444" y2="166" stroke="#b03a2e" stroke-width="6"/>
<text x="452" y="171" font-size="14" font-weight="700" fill="#2b2b2b">圆韧带</text>
<text x="452" y="194" font-size="13" fill="#4a4a4a">起自子宫角前方，止于阴阜</text>
<text x="452" y="214" font-size="13" fill="#4a4a4a">及大阴唇，维持子宫前倾</text>
<line x1="420" y1="246" x2="444" y2="246" stroke="#b08a3e" stroke-width="9"/>
<text x="452" y="251" font-size="14" font-weight="700" fill="#2b2b2b">主韧带</text>
<text x="452" y="274" font-size="13" fill="#4a4a4a">位于阔韧带底部，固定子宫</text>
<text x="452" y="294" font-size="13" fill="#4a4a4a">颈，防止子宫下垂（最重要）</text>
<line x1="420" y1="326" x2="444" y2="326" stroke="#2b6f6b" stroke-width="6" stroke-dasharray="7 5"/>
<text x="452" y="331" font-size="14" font-weight="700" fill="#2b2b2b">骶子宫韧带</text>
<text x="452" y="354" font-size="13" fill="#4a4a4a">自宫颈后方向后绕直肠至</text>
<text x="452" y="374" font-size="13" fill="#4a4a4a">骶骨前面，维持子宫前屈</text>
<text x="420" y="418" font-size="13" fill="#5a5450">※ 主韧带是维持子宫颈位置、</text>
<text x="420" y="438" font-size="13" fill="#5a5450">防止子宫下垂的主要结构</text>
